---
apiVersion: v1
kind: Namespace
metadata:
  name: ns-benjamin-vergara
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-benjamin-vergara
  namespace: ns-benjamin-vergara
data:
  AMBIENTE: "produccion"
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-benjamin-vergara
  namespace: ns-benjamin-vergara
type: Opaque
stringData:
  API_KEY: "tu-super-secreto-123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-benjamin-vergara
  namespace: ns-benjamin-vergara
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-benjamin-vergara
  template:
    metadata:
      labels:
        app: web-benjamin-vergara
    spec:
      containers:
      - name: app-container
        image: bvergara7/tarea-final:benjamin-vergara
        ports:
        - containerPort: 80
        env:
        - name: AMBIENTE
          valueFrom:
            configMapKeyRef:
              name: config-benjamin-vergara
              key: AMBIENTE
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: secret-benjamin-vergara
              key: API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: svc-benjamin-vergara
  namespace: ns-benjamin-vergara
spec:
  selector:
    app: web-benjamin-vergara
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP